name: binary-ab

# 多 IP、工具调用与 429 复现对照验证：
# 每个 shard 是一个独立 GitHub Actions Runner（独立公网出口 IP）。
# 同一个出口 IP 依次执行：
#   C0          官方 opencode CLI 2.2.0               基线（证明 IP 干净）
#   Z_clean     zen-direct 纯对话请求                  无客户端工具基线
#   Z_mimic     zen-direct 模仿复现 429 请求           带客户端 read/shell 工具（触发 zd_ 别名改写）
#   Z_tool_hist zen-direct 真实工具调用多轮历史        包含 assistant tool_calls 与 role=tool 返回
#   O_mimic     opencode2api 相同带工具请求对照

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'tools/**'
      - '.github/workflows/binary-ab.yml'

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install opencode cli
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: same-ip tool mimic and 429 repro ab
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_bab"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "=== Shard ${{ matrix.shard }} on IP=$IP ==="

          # 1. 干净基线请求（无客户端工具）
          cat > "$W/req_clean.json" <<'JSON'
          {
            "model": "deepseek-v4.1-flash-free",
            "stream": false,
            "messages": [
              {"role": "user", "content": "Reply with the single word: ok"}
            ]
          }
          JSON

          # 2. 模仿本地网关 429 的请求：客户端传入自定义 read 和 shell 工具定义
          cat > "$W/req_mimic.json" <<'JSON'
          {
            "model": "deepseek-v4.1-flash-free",
            "stream": false,
            "max_completion_tokens": 40000,
            "messages": [
              {"role": "user", "content": "Reply with the single word: ok"}
            ],
            "tools": [
              {
                "type": "function",
                "function": {
                  "name": "read",
                  "description": "Read a file from disk",
                  "parameters": {
                    "type": "object",
                    "properties": {"path": {"type": "string"}},
                    "required": ["path"]
                  }
                }
              },
              {
                "type": "function",
                "function": {
                  "name": "shell",
                  "description": "Run a shell command",
                  "parameters": {
                    "type": "object",
                    "properties": {"command": {"type": "string"}},
                    "required": ["command"]
                  }
                }
              }
            ]
          }
          JSON

          # 3. 真实工具调用历史请求（第 2 轮带着 tool_calls 和 role=tool 的回传）
          cat > "$W/req_tool_hist.json" <<'JSON'
          {
            "model": "deepseek-v4.1-flash-free",
            "stream": false,
            "messages": [
              {
                "role": "user",
                "content": "Check what is inside main.go"
              },
              {
                "role": "assistant",
                "content": null,
                "tool_calls": [
                  {
                    "id": "call_abc123",
                    "type": "function",
                    "function": {
                      "name": "read",
                      "arguments": "{\"path\":\"main.go\"}"
                    }
                  }
                ]
              },
              {
                "role": "tool",
                "tool_call_id": "call_abc123",
                "name": "read",
                "content": "package main\n\nfunc main() {}\n"
              }
            ],
            "tools": [
              {
                "type": "function",
                "function": {
                  "name": "read",
                  "description": "Read a file from disk",
                  "parameters": {
                    "type": "object",
                    "properties": {"path": {"type": "string"}},
                    "required": ["path"]
                  }
                }
              }
            ]
          }
          JSON

          # ---------- C0: 官方 CLI 基线 ----------
          set +e
          (cd "$W" && timeout 60 opencode run -m opencode/deepseek-v4.1-flash-free "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err")
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -n 2 "$W/c0.out" | head -c 120)"
          if [ "$C0" != "0" ]; then
            echo "IP=$IP DIRTY (CLI got rate limited):"
            cat "$W/c0.err" || true
            exit 0
          fi
          echo "IP=$IP CLEAN"
          sleep 3

          # ---------- 启动 zen-direct v2 ----------
          go build -trimpath -ldflags "-X main.appVersion=bab" -o "$W/zen-direct" .
          PORT=18091 "$W/zen-direct" >"$W/zen.log" 2>&1 &
          Z_PID=$!
          ZREADY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18091/health >/dev/null 2>&1; then ZREADY=1; break; fi
            sleep 0.5
          done
          if [ "$ZREADY" != "1" ]; then echo "Z gateway not ready"; tail -n 20 "$W/zen.log"; kill $Z_PID 2>/dev/null || true; exit 0; fi

          # 测试 1: Z_clean (纯对话)
          Z_CLEAN=$(curl -sS --max-time 150 -o "$W/z_clean.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:18091/v1/chat/completions \
            -H 'Content-Type: application/json' --data-binary @"$W/req_clean.json" || echo 000)
          echo "Z_clean (无工具纯文本) status=$Z_CLEAN body=$(head -c 200 "$W/z_clean.json")"
          sleep 3

          # 测试 2: Z_mimic (带客户端 read/shell 工具定义，触发 zd_ 别名)
          Z_MIMIC=$(curl -sS --max-time 150 -o "$W/z_mimic.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:18091/v1/chat/completions \
            -H 'Content-Type: application/json' --data-binary @"$W/req_mimic.json" || echo 000)
          echo "Z_mimic (带客户端工具定义) status=$Z_MIMIC body=$(head -c 200 "$W/z_mimic.json")"
          sleep 3

          # 测试 3: Z_tool_hist (真实多轮带 tool_calls 与 role=tool 历史)
          Z_TOOL_HIST=$(curl -sS --max-time 150 -o "$W/z_tool_hist.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:18091/v1/chat/completions \
            -H 'Content-Type: application/json' --data-binary @"$W/req_tool_hist.json" || echo 000)
          echo "Z_tool_hist (真实工具调用历史) status=$Z_TOOL_HIST body=$(head -c 200 "$W/z_tool_hist.json")"

          echo "--- zen.log 详细记录 ---"
          grep -E "\[REQ|alias|free-usage|upstream project" "$W/zen.log" | tail -15 || true
          kill $Z_PID 2>/dev/null || true
          sleep 3

          # ---------- 启动 opencode2api 对照 ----------
          git clone --depth 1 --branch v1.4.5 https://github.com/jasonxu114514/opencode2api "$W/o2a" 2>&1 | tail -1
          (cd "$W/o2a" && go build -trimpath -o "$W/o2a-gateway" ./cmd/opencode2api)

          cat > "$W/o2a-config.json" <<'JSON'
          {
            "listen": "127.0.0.1:18090",
            "server_keys": ["k"],
            "anonymous": true,
            "warp": { "enabled": false, "pool_size": 1, "stack": "ipv6" },
            "proxies": ["direct"],
            "upstream": { "anonymous": "https://opencode.ai/inference" },
            "retry": { "max_attempts": 1, "timeout_seconds": 180 },
            "models": { "refresh_seconds": 300, "free_only": true },
            "performance": {
              "max_idle_conns": 64,
              "max_idle_conns_per_host": 16,
              "idle_conn_timeout_seconds": 60,
              "connect_timeout_seconds": 10,
              "failure_cooldown_seconds": 15,
              "max_anonymous_exits": 1,
              "free_tier_block_seconds": 1
            },
            "logging": { "level": "info", "ring_size": 2000 }
          }
          JSON

          "$W/o2a-gateway" -config "$W/o2a-config.json" >"$W/o2a.log" 2>&1 &
          O2A_PID=$!
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18090/healthz >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.5
          done
          if [ "$READY" = "1" ]; then
            O_MIMIC=$(curl -sS --max-time 150 -o "$W/o_mimic.json" -w '%{http_code}' \
              -X POST http://127.0.0.1:18090/v1/chat/completions \
              -H 'Content-Type: application/json' -H 'Authorization: Bearer k' \
              --data-binary @"$W/req_mimic.json" || echo 000)
            echo "O_mimic opencode2api status=$O_MIMIC body=$(head -c 200 "$W/o_mimic.json")"
          else
            echo "O2A not ready"
            O_MIMIC=000
          fi
          kill $O2A_PID 2>/dev/null || true

          echo "=========================================================="
          echo "SHARD ${{ matrix.shard }} REPORT: C0=$C0 Z_clean=$Z_CLEAN Z_mimic=$Z_MIMIC Z_tool_hist=$Z_TOOL_HIST O_mimic=$O_MIMIC"
          echo "=========================================================="
