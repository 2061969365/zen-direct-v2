name: binary-ab

# 真实端到端工具调用闭环验证（Real Tool Loop AB）：
# 每个 shard 是一个独立 GitHub Actions Runner（独立公网出口 IP）。
# 在同一个出口 IP 上完整走完真实的工具执行闭环：
#   Round 1: 向模型发指令，强制模型决定调用 read 工具返回 tool_calls
#   Local Exec: 真实在 runner 上读取 VERSION 文件内容
#   Round 2: 把真实的工具执行结果以 role=tool 喂回给模型，模型返回最终分析文本

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'tools/**'
      - '.github/workflows/binary-ab.yml'

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install opencode cli
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version

      - name: real tool execution loop ab
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_bab"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "=== Shard ${{ matrix.shard }} on IP=$IP ==="

          # ---------- 1. 启动 zen-direct v2 ----------
          go build -trimpath -ldflags "-X main.appVersion=bab" -o "$W/zen-direct" .
          PORT=18091 "$W/zen-direct" >"$W/zen.log" 2>&1 &
          Z_PID=$!
          ZREADY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18091/health >/dev/null 2>&1; then ZREADY=1; break; fi
            sleep 0.5
          done
          if [ "$ZREADY" != "1" ]; then echo "Z gateway not ready"; tail -n 20 "$W/zen.log"; kill $Z_PID 2>/dev/null || true; exit 1; fi

          # ---------- 2. Python 执行真实的 2 轮工具调用闭环 ----------
          python3 - <<'PY'
          import urllib.request, json, os, sys, time

          GW = "http://127.0.0.1:18091/v1/chat/completions"
          MODEL = "deepseek-v4.1-flash-free"

          tools = [
              {
                  "type": "function",
                  "function": {
                      "name": "read",
                      "description": "Read the contents of a file or directory. Supports text files.",
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "path": {"type": "string", "description": "File path to read"}
                          },
                          "required": ["path"]
                      }
                  }
              }
          ]

          messages = [
              {"role": "user", "content": "Use the read tool to inspect VERSION file in current directory. Tell me the exact version string inside it."}
          ]

          def chat(msgs, t=None):
              payload = {"model": MODEL, "messages": msgs, "stream": False}
              if t:
                  payload["tools"] = t
              req = urllib.request.Request(GW, data=json.dumps(payload).encode("utf-8"), headers={"Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=90) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          print(">>> [Turn 1] Requesting model to call tool...")
          try:
              r1 = chat(messages, tools)
              choice1 = r1["choices"][0]
              msg1 = choice1["message"]
              tc = msg1.get("tool_calls")
              print("Turn 1 finish_reason:", choice1.get("finish_reason"))
              print("Turn 1 tool_calls count:", len(tc) if tc else 0)
              
              if not tc:
                  print("FAIL: Model did not emit tool_calls!")
                  sys.exit(1)
              
              messages.append(msg1)
              for call in tc:
                  fn = call["function"]
                  call_id = call["id"]
                  tool_name = fn["name"]
                  args = json.loads(fn["arguments"])
                  path = args.get("path", "VERSION")
                  print(f"Executing local file read for: {path} (tool_name={tool_name})...")
                  with open(path, "r", encoding="utf-8") as f:
                      content = f.read()
                  print(f"Real tool result: {content.strip()}")
                  messages.append({
                      "role": "tool",
                      "tool_call_id": call_id,
                      "name": tool_name,
                      "content": content
                  })
              
              print("\n>>> [Turn 2] Sending real tool output back to zen-direct...")
              r2 = chat(messages, tools)
              choice2 = r2["choices"][0]
              msg2 = choice2["message"]
              print("Turn 2 finish_reason:", choice2.get("finish_reason"))
              print("Turn 2 final content:\n", msg2.get("content"))
              print("\nSUCCESS: Real tool loop completed with 200 OK!")
          except urllib.error.HTTPError as e:
              err = e.read().decode("utf-8", "replace")
              print(f"FAIL: HTTPError {e.code}: {err}")
              sys.exit(1)
          except Exception as e:
              print(f"FAIL: Exception {e}")
              sys.exit(1)
          PY

          TOOL_LOOP_EXIT=$?
          echo "TOOL_LOOP_EXIT=$TOOL_LOOP_EXIT"

          echo "--- zen.log 详细记录 ---"
          grep -E "\[REQ|alias|free-usage|upstream project" "$W/zen.log" | tail -15 || true
          kill $Z_PID 2>/dev/null || true

          if [ "$TOOL_LOOP_EXIT" != "0" ]; then
            echo "Real tool loop FAILED!"
            exit 1
          fi

          echo "=========================================================="
          echo "SHARD ${{ matrix.shard }} FINAL RESULT: TOOL_LOOP_SUCCESS=1"
          echo "=========================================================="
