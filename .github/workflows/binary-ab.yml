name: binary-ab

# 同一个出口 IP，同一轮里依次：
#   C0  官方 opencode CLI                        期望 200（证明 IP/额度干净）
#   O1  opencode2api v1.4.5 二进制（匿名免费层）   他们的实现今天还过不过
#   Z1  zen-direct v2（原生 uTLS 传输）           我们的实现今天还过不过
#
# 顺序固定：C0 先证明 IP 干净；O1 在 Z1 之前，避免我们的 429 把出口连坐，
# 让 O1 的结论失真。O1 自己若 429 也会连坐，所以 Z1 的结果只作参考。

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install opencode cli
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: same-ip ab
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_bab"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "IP=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "IP=$IP DIRTY"; exit 0; fi
          echo "IP=$IP CLEAN"

          # ---------- O1: opencode2api v1.4.5 二进制 ----------
          git clone --depth 1 --branch v1.4.5 https://github.com/jasonxu114514/opencode2api "$W/o2a" 2>&1 | tail -1
          (cd "$W/o2a" && go build -trimpath -o "$W/o2a-gateway" ./cmd/opencode2api)
          ls -l "$W/o2a-gateway" | awk '{print "o2a binary:", $5, "bytes"}'

          cat > "$W/o2a-config.json" <<'JSON'
          {
            "listen": "127.0.0.1:18090",
            "server_keys": ["k"],
            "anonymous": true,
            "warp": { "enabled": false, "pool_size": 1, "stack": "ipv6" },
            "proxies": ["direct"],
            "upstream": { "anonymous": "https://opencode.ai/inference" },
            "retry": { "max_attempts": 1, "timeout_seconds": 180 },
            "models": { "refresh_seconds": 300, "free_only": true },
            "performance": {
              "max_idle_conns": 64,
              "max_idle_conns_per_host": 16,
              "idle_conn_timeout_seconds": 60,
              "connect_timeout_seconds": 10,
              "failure_cooldown_seconds": 15,
              "max_anonymous_exits": 1,
              "free_tier_block_seconds": 1
            },
            "logging": { "level": "info", "ring_size": 2000 }
          }
          JSON

          cat > "$W/req.json" <<'JSON'
          {"model":"deepseek-v4.1-flash-free","stream":false,
           "messages":[{"role":"user","content":"Reply with the single word: ok"}]}
          JSON

          "$W/o2a-gateway" -config "$W/o2a-config.json" >"$W/o2a.log" 2>&1 &
          O2A_PID=$!
          READY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18090/healthz >/dev/null 2>&1; then READY=1; break; fi
            sleep 0.5
          done
          echo "O1 healthz ready=$READY pid_alive=$(kill -0 $O2A_PID 2>/dev/null && echo yes || echo no)"
          if [ "$READY" != "1" ]; then echo "--- o2a log ---"; tail -n 40 "$W/o2a.log"; kill $O2A_PID 2>/dev/null || true; exit 0; fi
          O1=$(curl -sS --max-time 150 -o "$W/o1.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:18090/v1/chat/completions \
            -H 'Content-Type: application/json' -H 'Authorization: Bearer k' \
            --data-binary @"$W/req.json" || echo 000)
          echo "O1 opencode2api status=$O1 body=$(head -c 240 "$W/o1.json")"
          echo "--- o2a log tail ---"; tail -n 12 "$W/o2a.log" || true
          kill $O2A_PID 2>/dev/null || true
          sleep 1

          # ---------- Z1: zen-direct v2 ----------
          go build -trimpath -ldflags "-X main.appVersion=bab" -o "$W/zen-direct" .
          PORT=18091 "$W/zen-direct" >"$W/zen.log" 2>&1 &
          Z_PID=$!
          ZREADY=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18091/health >/dev/null 2>&1; then ZREADY=1; break; fi
            sleep 0.5
          done
          if [ "$ZREADY" != "1" ]; then echo "Z1 gateway not ready"; tail -n 20 "$W/zen.log"; kill $Z_PID 2>/dev/null || true; exit 0; fi
          Z1=$(curl -sS --max-time 150 -o "$W/z1.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:18091/v1/chat/completions \
            -H 'Content-Type: application/json' --data-binary @"$W/req.json" || echo 000)
          echo "Z1 zen-direct status=$Z1 body=$(head -c 240 "$W/z1.json")"
          grep -o 'upstream project=[0-9a-f]*' "$W/zen.log" | tail -1 || true
          kill $Z_PID 2>/dev/null || true

          echo "RESULT C0=$C0 O1=$O1 Z1=$Z1"
