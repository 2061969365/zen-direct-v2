name: fingerprint-ab

# 指纹场景 A/B × vpngate 干净出口
#
# 只测一种输入：客户端发「官方工具名 + 自己的描述文本」。
#   v0.9.39 → rename_complete，文本被替换成官方原文 → 指纹安全
#   v0.9.40 → passthrough，文本原样发出 → 指纹暴露
# 这是两个版本出站唯一不同的场景（45 工具那种两边都走改名，测了等于没测）。
#
# 出口走 vpngate：GitHub runner 的 Azure 出口常被刷满，必须先选一个真能出站的
# 干净节点。两个版本在同一台 runner、同一个 sing-box 隧道上跑，出口 IP 相同。

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: 轮数（每轮两个版本，顺序交替）
        required: false
        default: '2'
      old_ref:
        description: 旧版本提交
        required: false
        default: '6fb10d8'
      cap:
        description: 请求体夹具
        required: false
        default: 'tools/fixtures/dsh_official_names_dsh_text.json'

permissions:
  contents: read

env:
  WORK: ${{ github.workspace }}/_vpn
  VPMAX: '12'

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ROUNDS: ${{ github.event.inputs.rounds || '2' }}
      OLD_REF: ${{ github.event.inputs.old_ref || '6fb10d8' }}
      CAP_FILE: ${{ github.event.inputs.cap || 'tools/fixtures/dsh_official_names_dsh_text.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译两个版本
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w -X main.appVersion=v0.9.40" -o zen-0.9.40 .
          git worktree add /tmp/oldtree "$OLD_REF"
          ( cd /tmp/oldtree && go build -trimpath -ldflags "-s -w -X main.appVersion=v0.9.39" -o "$GITHUB_WORKSPACE/zen-0.9.39" . )
          A=$(sha256sum zen-0.9.39 | cut -d' ' -f1)
          B=$(sha256sum zen-0.9.40 | cut -d' ' -f1)
          echo "old=$A"
          echo "new=$B"
          [ "$A" != "$B" ] || { echo "::error::两个二进制相同"; exit 1; }

      - name: 校验夹具是这个场景（全部官方名 + 非官方文本）
        run: |
          set -euo pipefail
          python3 tools/ab_fingerprint.py --check "$CAP_FILE" || {
            echo "::error::夹具校验失败"; exit 1; }

      - name: "Egress vpngate - fetch toolbox"
        run: |
          set -uo pipefail
          VD="$WORK/vpngate"
          mkdir -p "$VD"
          cd "$VD"
          curl -fsSL --retry 3 --retry-delay 1 -o nodes.csv "https://www.vpngate.net/api/iphone/" || {
            echo "::error::取不到 VPN Gate 快照"; exit 1; }
          echo "nodes.csv 行数=$(wc -l < nodes.csv)"
          sb_tag=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' 2>/dev/null || echo v1.12.0)
          sb_ver=${sb_tag#v}
          echo "sing-box tag=$sb_tag"
          curl -fsSL --retry 3 --retry-delay 1 -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${sb_tag}/sing-box-${sb_ver}-linux-amd64.tar.gz" || {
            echo "::error::下载 sing-box 失败"; exit 1; }
          tar -xzf sing-box.tar.gz
          install -m 0755 "sing-box-${sb_ver}-linux-amd64/sing-box" ./sing-box
          ./sing-box version | head -2 || true
          curl -fsSL --retry 3 -o probe_and_select_vpngate.py \
            "https://raw.githubusercontent.com/2061969365/zen-vpngate-cloud-test/main/scripts/probe_and_select_vpngate.py" || {
            echo "::error::取不到探测脚本"; exit 1; }
          curl -fsSL --retry 3 -o pin_sb.py \
            "https://raw.githubusercontent.com/2061969365/zen-vpngate-cloud-test/main/scripts/pin_sb.py" || {
            echo "::error::取不到 pin_sb.py"; exit 1; }
          ls -l

      - name: "Egress vpngate - pick clean node"
        run: |
          set -uo pipefail
          VD="$WORK/vpngate"
          cd "$VD"
          ok=0
          for attempt in 1 2 3; do
            echo "--- 选节点：第 $attempt/3 次（最多 $VPMAX 个候选）"
            set +e
            python3 probe_and_select_vpngate.py \
              --csv nodes.csv \
              --output "$VD/sb.json" \
              --zen-bin "$GITHUB_WORKSPACE/zen-0.9.39" \
              --singbox-bin "$VD/sing-box" \
              --mixed-port 18080 \
              --max-candidates "$VPMAX" \
              --concurrency 8 \
              --keep-nodes 1 > "select-$attempt.log" 2>&1
            rc=$?
            set -e
            tail -30 "select-$attempt.log" || true
            if [ "$rc" != "0" ] || [ ! -s sb.json ]; then
              echo "第 $attempt 次没选出节点（rc=$rc）"
              continue
            fi
            if ! line=$(python3 pin_sb.py sb.json); then
              echo "第 $attempt 次配置不可用（$line），重试"
              continue
            fi
            echo "节点：$line"
            ok=1
            break
          done
          if [ "$ok" != "1" ]; then
            echo "::error::vpngate 选不出节点——不降级到 direct（那会污染额度对照）"
            exit 1
          fi

      - name: "Egress vpngate - start sing-box"
        run: |
          set -uo pipefail
          VD="$WORK/vpngate"
          cd "$VD"
          port_open() {
            python3 -c "import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0 if s.connect_ex(('127.0.0.1', int(sys.argv[1])))==0 else 1)" "$1"
          }
          nohup ./sing-box run -c sb.json > singbox.log 2>&1 &
          echo $! > singbox.pid
          listen=0
          for i in $(seq 1 25); do
            if port_open 18080; then listen=1; break; fi
            sleep 1
          done
          if [ "$listen" != "1" ]; then
            echo "::error::sing-box 没监听 18080"
            tail -40 singbox.log || true
            exit 1
          fi
          ip=""
          for i in $(seq 1 4); do
            ip=$(curl -s -m 25 --proxy http://127.0.0.1:18080 https://api.ipify.org 2>/dev/null | tr -d '[:space:]' || true)
            [ -n "$ip" ] && break
            sleep 3
          done
          if [ -z "$ip" ]; then
            echo "::error::vpngate 隧道取不到出口 IP"
            tail -40 singbox.log || true
            exit 1
          fi
          echo "vpngate 出口 IP: $ip"
          echo "VPN_EGRESS_IP=$ip" >> "$GITHUB_ENV"

      - name: 指纹场景 A/B（同出口）
        env:
          DSH_CAP: ${{ github.workspace }}/${{ github.event.inputs.cap || 'tools/fixtures/dsh_official_names_dsh_text.json' }}
          AB_OUT: ab_fingerprint.json
          BIN_OLD: ${{ github.workspace }}/zen-0.9.39
          BIN_NEW: ${{ github.workspace }}/zen-0.9.40
          GATEWAY_PROXY: http://127.0.0.1:18080
        run: |
          set -uo pipefail
          python3 tools/ab_fingerprint.py 2>&1 | tee ab.log
          rc=${PIPESTATUS[0]}
          {
            echo ""
            echo "### 指纹场景 A/B（出口 $VPN_EGRESS_IP）"
            echo '```'
            tail -45 ab.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: 网关日志
        if: always()
        run: |
          set -uo pipefail
          for f in /tmp/gwf-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E 'tool_shape|429|listening' "$f" | tail -15 || true
          done

      - name: Stop sing-box
        if: always()
        run: |
          set -uo pipefail
          if [ -f "$WORK/vpngate/singbox.pid" ]; then
            kill "$(cat "$WORK/vpngate/singbox.pid")" 2>/dev/null || true
          fi
          pkill -f "sing-box run -c sb" || true
          echo done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fingerprint-ab-${{ github.run_id }}
          path: |
            ab_fingerprint.json
            ab.log
          retention-days: 7
          if-no-files-found: warn
