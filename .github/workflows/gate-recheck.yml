name: gate-recheck

# 上游门禁今天开始对我们的抓包请求回 429（三种 project 策略全中，含旧的 global），
# 而同一 IP 上官方 CLI 都成功。这里在三个独立 IP 上分别定位是哪一维变了。
#
#   bun   bun fetch（抓包 body + 真 session）      抓包请求本身还有效吗
#   o2a   opencode2api v1.4.5 的 BunTransport      是“我们的 hello”退化了，还是上游变了
#   ua    我们的传输，UA 换成当前 CLI 版本          是不是版本门禁
#
# 顺序很重要：每个 scenario 的第一发必须是待测项本身。已知一次 free-limit 429
# 会把出口连坐十几分钟，先跑对照会污染结论。

on:
  workflow_dispatch:

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [bun, o2a, ua]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install bun + opencode cli
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version || echo "no bun"
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: scenario ${{ matrix.scenario }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_rc"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          CLI_VER=$(opencode --version 2>/dev/null | head -1 | tr -d 'v' || true)
          echo "scenario=${{ matrix.scenario }} ip=$IP cli=$CLI_VER"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SCENARIO ${{ matrix.scenario }} IP=$IP DIRTY"; exit 0; fi
          echo "SCENARIO ${{ matrix.scenario }} IP=$IP CLEAN"

          REAL=$(python3 - <<'PY'
          import os, re, sqlite3
          db = os.path.expanduser("~/.local/share/opencode/opencode.db")
          try:
              con = sqlite3.connect(db)
              for t in [r[0] for r in con.execute("select name from sqlite_master where type='table'")]:
                  try:
                      rows = con.execute("select * from %s order by rowid desc limit 40" % t).fetchall()
                  except Exception:
                      continue
                  for row in rows:
                      for v in row:
                          if isinstance(v, str):
                              m = re.findall(r"ses_[0-9A-Za-z]{20,}", v)
                              if m:
                                  print(m[0]); raise SystemExit
          except SystemExit:
              raise
          except Exception:
              pass
          PY
          )
          echo "REAL=$REAL"; [ -n "$REAL" ] || exit 0

          go build -trimpath -ldflags "-X main.appVersion=rc" -o "$W/zen-direct" .
          BODY="$PWD/tools/cli_capture_body.json"

          case "${{ matrix.scenario }}" in
            bun)
              echo "=== bun fetch FIRST (captured body, real session, global project) ==="
              cat > "$W/bun.js" <<'JS'
              const fs = require("fs");
              const body = fs.readFileSync(process.env.BODY, "utf8");
              const ses = process.env.SES;
              const headers = {
                "Authorization": "Bearer public",
                "Content-Type": "application/json",
                "User-Agent": "opencode/latest/2.0.29/cli",
                "X-Opencode-Client": "cli",
                "X-Opencode-Project": "global",
                "X-Opencode-Session": ses,
                "X-Opencode-Session-Id": ses,
                "X-Session-Affinity": ses,
                "X-Session-Id": ses,
              };
              const r = await fetch("https://opencode.ai/inference/v1/chat/completions",
                { method: "POST", headers, body });
              const t = await r.text();
              console.log("BUN -> " + r.status + " ra=" + (r.headers.get("retry-after") || "") + " " + JSON.stringify(t.slice(0, 160)));
              process.exit(r.status === 200 ? 0 : 1);
              JS
              BODY="$BODY" SES="$REAL" "$HOME/.bun/bin/bun" "$W/bun.js" || true
              ;;
            o2a)
              echo "=== opencode2api v1.4.5 BunTransport FIRST ==="
              git clone --depth 1 --branch v1.4.5 https://github.com/jasonxu114514/opencode2api "$W/o2a" 2>&1 | tail -1
              mkdir -p "$W/o2a/cmd/abprobe"
              cp tools/abprobe/main.go "$W/o2a/cmd/abprobe/main.go"
              (cd "$W/o2a" && go build -tags abprobe -o "$W/abprobe" ./cmd/abprobe)
              "$W/abprobe" -mode utls -session "$REAL" -body "$BODY" || true
              ;;
            ua)
              echo "=== our transport FIRST, UA=opencode/latest/$CLI_VER/cli ==="
              ZEN_PROBE_BODY="$BODY" ZEN_PROBE_SESSION="$REAL" \
                ZEN_PROBE_UA="opencode/latest/$CLI_VER/cli" "$W/zen-direct" || true
              ;;
          esac
