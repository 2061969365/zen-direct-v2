name: gateway-e2e

# 端到端：真正起网关，走完整链路（协议转换 + 会话池 + 注入 + SSE 回传），
# 不经过 -probe 捷径。
#
# 每个 shard 一个独立出口 IP：
#   N1  ZEN_TLS=bun（默认）  网关 → 上游，期望 200 且 SSE 收满（含 [DONE]）
#   G1  ZEN_TLS=go           同请求，期望 429（阴性对照：证明差异来自传输层）
#
# 判定：N1=200 且 G1=429 → 端到端可用；N1=429 且 C0 通过 → 网关侧还有整形问题。

on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install opencode cli
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_e2e"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"; exit 0; fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          go build -trimpath -ldflags "-X main.appVersion=e2e" -o "$W/zen-direct" .
          trap 'kill ${PID1:-} ${PID2:-} ${PID3:-} 2>/dev/null' EXIT
          echo "built: $(ls -l "$W/zen-direct" | awk '{print $5}') bytes"

          cat > "$W/req.json" <<'JSON'
          {"model":"deepseek-v4.1-flash-free","stream":true,
           "messages":[{"role":"user","content":"Reply with the single word: ok"}],
           "tools":[
             {"type":"function","function":{"name":"Read","description":"Read a file from disk","parameters":{"type":"object","properties":{"path":{"type":"string"}},"required":["path"]}}},
             {"type":"function","function":{"name":"Bash","description":"Run a shell command","parameters":{"type":"object","properties":{"command":{"type":"string"}},"required":["command"]}}}
           ]}
          JSON

          wait_gw() {
            for i in $(seq 1 40); do
              curl -fsS "http://127.0.0.1:$1/health" >/dev/null 2>&1 && return 0
              sleep 0.5
            done
            return 1
          }

          echo "=== N1: native gateway (ZEN_TLS=bun) ==="
          PORT=18081 "$W/zen-direct" >"$W/gw-native.log" 2>&1 &
          PID1=$!
          if ! wait_gw 18081; then echo "native gateway not ready"; tail -n 20 "$W/gw-native.log"; kill $PID1 2>/dev/null; exit 1; fi
          curl -sS http://127.0.0.1:18081/health; echo
          CODE=$(curl -sS --max-time 150 -o "$W/stream.txt" -w '%{http_code}' \
            -X POST http://127.0.0.1:18081/v1/chat/completions \
            -H 'Content-Type: application/json' --data-binary @"$W/req.json" || echo 000)
          CHUNKS=$(grep -c '^data:' "$W/stream.txt" 2>/dev/null || true)
          DONE=$(grep -c '\[DONE\]' "$W/stream.txt" 2>/dev/null || true)
          echo "E2E native status=$CODE chunks=$CHUNKS done=$DONE bytes=$(wc -c <"$W/stream.txt")"
          head -c 200 "$W/stream.txt"; echo
          tail -c 160 "$W/stream.txt"; echo
          kill $PID1 2>/dev/null; sleep 1
          echo "--- native gateway log ---"; tail -n 10 "$W/gw-native.log"

          echo "=== G1: stdlib gateway (ZEN_TLS=go, 阴性对照) ==="
          ZEN_TLS=go PORT=18082 "$W/zen-direct" >"$W/gw-go.log" 2>&1 &
          PID2=$!
          if wait_gw 18082; then
            CODE2=$(curl -sS --max-time 90 -o "$W/stream-go.txt" -w '%{http_code}' \
              -X POST http://127.0.0.1:18082/v1/chat/completions \
              -H 'Content-Type: application/json' --data-binary @"$W/req.json" || echo 000)
            echo "E2E stdlib status=$CODE2 body=$(head -c 200 "$W/stream-go.txt")"
            kill $PID2 2>/dev/null
          else
            CODE2=000; echo "stdlib gateway not ready"
          fi

          if [ "${{ matrix.shard }}" = "1" ]; then
            echo "=== N2: native gateway, 非流式（聚合成 JSON）==="
            sed 's/"stream":true/"stream":false/' "$W/req.json" > "$W/req-ns.json"
            PORT=18083 "$W/zen-direct" >"$W/gw-ns.log" 2>&1 &
            PID3=$!
            if wait_gw 18083; then
              CODE3=$(curl -sS --max-time 150 -o "$W/nonstream.json" -w '%{http_code}' \
                -X POST http://127.0.0.1:18083/v1/chat/completions \
                -H 'Content-Type: application/json' --data-binary @"$W/req-ns.json" || echo 000)
              echo "E2E nonstream status=$CODE3 body=$(head -c 240 "$W/nonstream.json")"
              python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print("nonstream choice ok:", str(d["choices"][0]["message"])[:120])' "$W/nonstream.json" || true
              kill $PID3 2>/dev/null
            else
              echo "nonstream gateway not ready"
            fi
          fi

          if [ "$CODE" != "200" ] || [ "$DONE" -lt 1 ]; then
            echo "RESULT native=FAIL status=$CODE done=$DONE stdlib=$CODE2"
            exit 1
          fi
          echo "RESULT native=OK status=$CODE chunks=$CHUNKS done=$DONE stdlib=$CODE2"
