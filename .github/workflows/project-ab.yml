name: project-ab

# 干净 A/B：每个 scenario 一个独立出口 IP，只跑 probe（不起网关、不进会话池）。
#
#   global   显式发 "global"（旧行为，作为基线）      期望 200
#   fixed40  显式发一个固定 40 位 hex                 看任意 40hex 是否也过
#   fresh    不配置 → 每次现签一个（v1.4.5 的做法）    两发，看是否换桶仍过
#
# 为什么必须分 IP：已知「吃一次 free-limit 429 会把出口连坐数分钟」，
# 同一 IP 上先跑的 scenario 会污染后面的，A/B 就失效了。
#
# 判定：
#   global=200, fixed40=200, fresh=200/200 → 现签 project 可用
#   global=200, fixed40=429, fresh=429     → 上游不认任意 40hex，回退 global
#   global=429                             → 不是 project 的问题，另有原因

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [global, fixed40, fresh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install opencode cli
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: scenario ${{ matrix.scenario }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_pab"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "scenario=${{ matrix.scenario }} ip=$IP"

          # C0：官方 CLI 能通，才算这个 IP 干净（否则本 shard 作废）
          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SCENARIO ${{ matrix.scenario }} IP=$IP DIRTY"; exit 0; fi
          echo "SCENARIO ${{ matrix.scenario }} IP=$IP CLEAN"

          REAL=$(python3 - <<'PY'
          import os, re, sqlite3
          db = os.path.expanduser("~/.local/share/opencode/opencode.db")
          try:
              con = sqlite3.connect(db)
              for t in [r[0] for r in con.execute("select name from sqlite_master where type='table'")]:
                  try:
                      rows = con.execute("select * from %s order by rowid desc limit 40" % t).fetchall()
                  except Exception:
                      continue
                  for row in rows:
                      for v in row:
                          if isinstance(v, str):
                              m = re.findall(r"ses_[0-9A-Za-z]{20,}", v)
                              if m:
                                  print(m[0]); raise SystemExit
          except SystemExit:
              raise
          except Exception:
              pass
          PY
          )
          echo "REAL=$REAL"; [ -n "$REAL" ] || exit 0

          go build -trimpath -ldflags "-X main.appVersion=ab" -o "$W/zen-direct" .
          FIXED=$(python3 -c 'import hashlib; print(hashlib.sha256(b"project-ab").hexdigest()[:40])')

          run_probe() {
            ZEN_PROBE_BODY="$PWD/tools/cli_capture_body.json" ZEN_PROBE_SESSION="$REAL" \
              "$@" "$W/zen-direct" || true
          }

          case "${{ matrix.scenario }}" in
            global)
              echo "=== A: project=global (baseline) ==="
              run_probe env OPENCODE_ZEN_PROJECT=global
              ;;
            fixed40)
              echo "=== C: project=$FIXED (fixed 40hex) ==="
              run_probe env OPENCODE_ZEN_PROJECT="$FIXED"
              ;;
            fresh)
              echo "=== B: fresh project, first call ==="
              run_probe
              sleep 2
              echo "=== B: fresh project, second call (same session) ==="
              run_probe
              ;;
          esac
