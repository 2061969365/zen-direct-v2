name: run-gateway-selftest

# 直接跑模板里的 scripts/run-gateway.sh（不是重写一遍），验证：
#   1) 起手先走本地 chat 探针，200 才继续；
#   2) 公网段只验 /health，429/5xx 不触发交班；
#   3) 周期探测单次 429 不交班；
#   4) 交班原因里不出现 429。
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xia35480/zen
          ref: main
          path: gw

      - name: check binary
        run: |
          set -euo pipefail
          chmod +x gw/bin/zen-direct
          ls -l gw/bin/zen-direct
          sha256sum gw/bin/zen-direct

      - name: inspect probe logic (static)
        run: |
          set -euo pipefail
          cd gw
          echo "=== 起手走本地 ==="
          grep -n 'boot probe (local)' scripts/run-gateway.sh
          echo "=== 隧道只验 /health ==="
          grep -n 'tunnel check' scripts/run-gateway.sh
          echo "=== 不应再把 chat 探针打公网 ==="
          if grep -n 'probe_once "\$PUBLIC_URL"' scripts/run-gateway.sh; then
            echo "::error::仍然把 chat 探针打公网"
            exit 1
          fi
          echo "OK: 没有 probe_once PUBLIC_URL"
          echo "=== 周期 429 容错 ==="
          grep -n '次周期探测 429' scripts/run-gateway.sh

      - name: run script against a fake tunnel
        run: |
          set -uo pipefail
          cd gw
          chmod +x scripts/run-gateway.sh

          cat > /tmp/fake_tunnel.py <<'PY'
          import http.server, socketserver
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b'{"status":"ok","fake":"tunnel"}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          socketserver.TCPServer(("127.0.0.1", 18099), H).serve_forever()
          PY
          python3 /tmp/fake_tunnel.py &
          FAKE=$!
          sleep 1
          curl -s -m 5 http://127.0.0.1:18099/health; echo

          mkdir -p run
          set +e
          GITHUB_WORKSPACE="$PWD" \
            PORT=18081 \
            MAX_RUN_SEC=20 \
            PROBE_INTERVAL_SEC=5 \
            ZEN_PUBLIC_HOST=127.0.0.1:18099 \
            timeout -s TERM 75 bash scripts/run-gateway.sh > /tmp/gw-run.log 2>&1
          rc=$?
          set -e
          kill "$FAKE" 2>/dev/null || true
          echo "script exit=$rc"

          echo "=== 关键行 ==="
          grep -E 'boot probe \(local\)|tunnel check|网关就绪|隧道已通|IP 可用|交班|周期探测' /tmp/gw-run.log || true
          echo "=== rotate flag ==="
          cat run/rotate.flag 2>/dev/null || echo "(no rotate flag)"

          echo "=== 断言 ==="
          grep -q 'boot probe (local) #1/3 -> 200' /tmp/gw-run.log \
            || { echo "::error::起手本地探针没有 200"; exit 1; }
          grep -q '网关就绪（本地 chat 200）' /tmp/gw-run.log \
            || { echo "::error::没走到网关就绪"; exit 1; }
          grep -q 'IP 可用，开始服务' /tmp/gw-run.log \
            || { echo "::error::没走到 IP 可用"; exit 1; }
          if grep -qE '交班：.*429' /tmp/gw-run.log; then
            echo "::error::仍然因为 429 交班"
            exit 1
          fi
          echo "SELFTEST PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-gateway-selftest
          path: |
            /tmp/gw-run.log
            gw/run/
