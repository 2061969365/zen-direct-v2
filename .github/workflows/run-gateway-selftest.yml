name: run-gateway-selftest

# 直接跑模板里的 scripts/run-gateway.sh（不是重写一遍），只把不该在 CI 里做的
# 东西缩掉：MAX_RUN_SEC 短、不真连 Cloudflare 命名隧道（用本地 HTTP 服务冒充
# PUBLIC_URL），以此验证：
#   1) 起手先走本地 chat 探针，且必须是 200 才继续；
#   2) 公网段只验 /health，429/5xx 不再触发交班；
#   3) 周期探测单次 429 不交班；
#   4) 脚本语法、变量、退出路径都正确。
on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: xia35480/zen
          ref: main
          path: gw

      - name: fetch fresh binary
        run: |
          set -euo pipefail
          mkdir -p gw/bin
          chmod +x gw/bin/zen-direct 2>/dev/null || true
          ls -l gw/bin/zen-direct
          sha256sum gw/bin/zen-direct

      - name: inspect probe logic (static)
        run: |
          set -euo pipefail
          cd gw
          echo "=== 起手是否先本地 ==="
          grep -n 'boot probe (local)' scripts/run-gateway.sh
          echo "=== 公网是否只用 /health ==="
          grep -n 'tunnel check' scripts/run-gateway.sh
          echo "=== 是否还有把 chat 探针打公网 ==="
          if grep -n 'probe_once "$PUBLIC_URL"' scripts/run-gateway.sh; then
            echo "::error::仍然把 chat 探针打公网"
            exit 1
          fi
          echo "OK: 没有 probe_once PUBLIC_URL"
          echo "=== 周期 429 容错 ==="
          grep -n '连续 \$limit_count 次周期探测' scripts/run-gateway.sh

      - name: run script against a fake tunnel
        run: |
          set -uo pipefail
          cd gw
          chmod +x scripts/run-gateway.sh

          # 冒充 PUBLIC_URL：一个小 HTTP 服务，/health 直接 200，
          # 用来证明「隧道段只验 /health、且失败不交班」。
          cat > /tmp/fake_tunnel.py <<'PY'
          import http.server, socketserver
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  body = b'{"status":"ok","fake":"tunnel"}'
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *a):
                  pass
          socketserver.TCPServer(("127.0.0.1", 18099), H).serve_forever()
          PY
          python3 /tmp/fake_tunnel.py &
          FAKE=$!
          sleep 1
          curl -s -m 5 http://127.0.0.1:18099/health; echo

          mkdir -p run
          # 只跑到「IP 可用，开始服务」就停：MAX_RUN_SEC=1 让它在第一轮后交班。
          GITHUB_WORKSPACE="$PWD" \
            PORT=18081 \
            MAX_RUN_SEC=1 \
            PROBE_INTERVAL_SEC=5 \
            CF_TUNNEL_TOKEN= \
            ZEN_PUBLIC_HOST=127.0.0.1:18099 \
            timeout 180 bash scripts/run-gateway.sh 2>&1 | tee /tmp/gw-run.log || true
          kill "$FAKE" 2>/dev/null || true

          echo "=== 关键断言 ==="
          grep -E 'boot probe \(local\)|tunnel check|网关就绪|隧道已通|IP 可用|交班' /tmp/gw-run.log || true
          echo "=== rotate flag ==="
          cat run/rotate.flag 2>/dev/null || echo "(no rotate flag)"

          if ! grep -q 'boot probe (local) #1/3 -> 200' /tmp/gw-run.log; then
            echo "::error::起手本地探针没有拿到 200"
            exit 1
          fi
          if ! grep -q '网关就绪（本地 chat 200）' /tmp/gw-run.log; then
            echo "::error::没有走到「网关就绪」"
            exit 1
          fi
          if ! grep -q 'IP 可用，开始服务' /tmp/gw-run.log; then
            echo "::error::没有走到「IP 可用，开始服务」"
            exit 1
          fi
          reason="$(cat run/rotate.flag 2>/dev/null || true)"
          case "$reason" in
            *429*) echo "::error::仍然因为 429 交班：$reason"; exit 1 ;;
          esac
          echo "SELFTEST PASS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-gateway-selftest
          path: |
            /tmp/gw-run.log
            gw/run/
