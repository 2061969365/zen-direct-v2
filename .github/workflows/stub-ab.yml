name: stub-ab

# 补桩 vs 不补桩，同一出口、同一请求体。
#
# 背景：DSH 发 45 个工具 → 网关补 14 个官方桩 → 出站 59 个 → 实测 429。
# 同一出口逐档加压：12/20/30 个入参（出站 26/34/44）都 200，40 个入参
# （出站 54）就 429。所以问题是「出站工具数」还是「补桩这个动作」？
#
# 这个实验只改 ZEN_NO_STUB：
#   补桩   → 出站 59
#   不补桩 → 出站 45
# 交替跑两轮，排除「谁先跑谁吃额度」。
#
# 跑前先预检隧道能吃到 200，探不到就跳过，不产出无效结论。

on:
  workflow_dispatch:
    inputs:
      cap:
        description: 请求体夹具
        required: false
        default: 'tools/fixtures/dsh_capture.json'

permissions:
  contents: read

env:
  WORK: ${{ github.workspace }}/_vpn
  VPMAX: '12'

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CAP_FILE: ${{ github.event.inputs.cap || 'tools/fixtures/dsh_capture.json' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 编译网关（含 ZEN_NO_STUB 开关）
        run: |
          set -euo pipefail
          go build -trimpath -ldflags "-s -w -X main.appVersion=v0.9.41-stubab" -o zen-gateway .
          ls -l zen-gateway
          # 确认开关真的编进去了
          strings zen-gateway | grep -q ZEN_NO_STUB || {
            echo "::error::二进制里没有 ZEN_NO_STUB"; exit 1; }
          echo "ZEN_NO_STUB 已编入"

      - name: 校验夹具
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); n=len(d.get("tools") or []); print("工具数=%d" % n); sys.exit(0 if n > 0 else 1)' "$CAP_FILE"

      - name: "Egress vpngate - fetch toolbox"
        run: |
          set -uo pipefail
          VD="$WORK/vpngate"
          mkdir -p "$VD"
          cd "$VD"
          curl -fsSL --retry 3 --retry-delay 1 -o nodes.csv "https://www.vpngate.net/api/iphone/" || {
            echo "::error::取不到 VPN Gate 快照"; exit 1; }
          echo "nodes.csv 行数=$(wc -l < nodes.csv)"
          sb_tag=$(curl -fsSL https://api.github.com/repos/SagerNet/sing-box/releases/latest \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])' 2>/dev/null || echo v1.12.0)
          sb_ver=${sb_tag#v}
          curl -fsSL --retry 3 --retry-delay 1 -o sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${sb_tag}/sing-box-${sb_ver}-linux-amd64.tar.gz" || {
            echo "::error::下载 sing-box 失败"; exit 1; }
          tar -xzf sing-box.tar.gz
          install -m 0755 "sing-box-${sb_ver}-linux-amd64/sing-box" ./sing-box
          ./sing-box version | head -2 || true
          curl -fsSL --retry 3 -o probe_and_select_vpngate.py \
            "https://raw.githubusercontent.com/2061969365/zen-vpngate-cloud-test/main/scripts/probe_and_select_vpngate.py" || {
            echo "::error::取不到探测脚本"; exit 1; }
          curl -fsSL --retry 3 -o vpngate_to_singbox.py \
            "https://raw.githubusercontent.com/2061969365/zen-vpngate-cloud-test/main/scripts/vpngate_to_singbox.py" || {
            echo "::error::取不到 vpngate_to_singbox.py"; exit 1; }
          cat > pin_sb.py <<'PY'
          import json
          import sys

          path = sys.argv[1]
          cfg = json.load(open(path, encoding="utf-8"))
          eps = cfg.get("endpoints") or []
          if len(eps) != 1:
              print(f"UNUSABLE endpoints={len(eps)}", flush=True)
              sys.exit(2)
          ep = eps[0]
          tag = ep.get("tag") or "vpngate-0"
          ep["tag"] = tag
          cfg["endpoints"] = [ep]
          cfg["outbounds"] = [{"type": "direct", "tag": "direct"}]
          cfg.setdefault("route", {})["final"] = tag
          cfg.setdefault("log", {})["level"] = "info"
          json.dump(cfg, open(path, "w", encoding="utf-8"), indent=2)
          print("OK", ep.get("server"), ep.get("server_port"), tag, flush=True)
          PY
          ls -l

      - name: "Egress vpngate - pick clean node"
        run: |
          set -uo pipefail
          VD="$WORK/vpngate"
          cd "$VD"
          ok=0
          for attempt in 1 2 3; do
            echo "--- 选节点：第 $attempt/3 次"
            set +e
            python3 probe_and_select_vpngate.py \
              --csv nodes.csv --output "$VD/sb.json" \
              --zen-bin "$GITHUB_WORKSPACE/zen-gateway" \
              --singbox-bin "$VD/sing-box" --mixed-port 18080 \
              --max-candidates "$VPMAX" --concurrency 8 --keep-nodes 1 \
              > "select-$attempt.log" 2>&1
            rc=$?
            set -e
            tail -20 "select-$attempt.log" || true
            [ "$rc" = "0" ] && [ -s sb.json ] || { echo "第 $attempt 次没选出"; continue; }
            line=$(python3 pin_sb.py sb.json) || { echo "配置不可用: $line"; continue; }
            echo "节点：$line"
            ok=1
            break
          done
          if [ "$ok" != "1" ]; then
            echo "::error::vpngate 选不出节点——不降级到 direct"
            exit 1
          fi

      - name: "Egress vpngate - start sing-box"
        run: |
          set -uo pipefail
          VD="$WORK/vpngate"
          cd "$VD"
          nohup ./sing-box run -c sb.json > singbox.log 2>&1 &
          echo $! > singbox.pid
          for i in $(seq 1 30); do
            python3 -c "import socket,sys; s=socket.socket(); s.settimeout(1); sys.exit(0 if s.connect_ex(('127.0.0.1',18080))==0 else 1)" && break
            sleep 1
          done
          ip=""
          for i in $(seq 1 10); do
            ip=$(curl -s -m 25 --proxy http://127.0.0.1:18080 https://api.ipify.org 2>/dev/null | tr -d '[:space:]' || true)
            [ -n "$ip" ] && break
            echo "  取出口 IP 第 $i 次未成功"
            sleep 5
          done
          [ -n "$ip" ] || { echo "::error::取不到出口 IP"; tail -40 singbox.log; exit 1; }
          echo "vpngate 出口 IP: $ip"
          echo "VPN_EGRESS_IP=$ip" >> "$GITHUB_ENV"

      - name: 补桩 vs 不补桩
        env:
          DSH_CAP: ${{ github.workspace }}/${{ github.event.inputs.cap || 'tools/fixtures/dsh_capture.json' }}
          AB_OUT: stub_ab.json
          BIN: ${{ github.workspace }}/zen-gateway
          GATEWAY_PROXY: http://127.0.0.1:18080
        run: |
          set -uo pipefail
          echo "--- 隧道预检 ---"
          PRE_OK=0
          for attempt in 1 2 3; do
            PORT=18599 HTTPS_PROXY=http://127.0.0.1:18080 HTTP_PROXY=http://127.0.0.1:18080 \
              NO_PROXY=127.0.0.1,localhost "$GITHUB_WORKSPACE/zen-gateway" >/tmp/pre.log 2>&1 &
            GW_PID=$!
            for i in $(seq 1 20); do
              curl -fsS --noproxy '*' http://127.0.0.1:18599/health >/dev/null 2>&1 && break
              sleep 0.5
            done
            CODE=$(curl -s -o /tmp/pre.json -w '%{http_code}' --noproxy '*' --max-time 100 \
              -H 'content-type: application/json' \
              -d '{"model":"deepseek-v4.1-flash-free","stream":false,"messages":[{"role":"user","content":"ok"}],"max_tokens":8}' \
              http://127.0.0.1:18599/v1/chat/completions 2>/dev/null) || true
            [ -z "$CODE" ] && CODE=000
            echo "预检 #$attempt -> $CODE"
            kill "$GW_PID" 2>/dev/null || true
            wait "$GW_PID" 2>/dev/null || true
            [ "$CODE" = "200" ] && { PRE_OK=1; break; }
            sleep 5
          done
          if [ "$PRE_OK" != "1" ]; then
            echo "::warning::隧道此刻拿不到 200，跳过（结论无意义）"
            exit 0
          fi
          python3 tools/stub_ab.py 2>&1 | tee stub_ab.log
          rc=${PIPESTATUS[0]}
          {
            echo ""
            echo "### 补桩 vs 不补桩（出口 $VPN_EGRESS_IP）"
            echo '```'
            tail -30 stub_ab.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: 网关日志
        if: always()
        run: |
          set -uo pipefail
          for f in /tmp/gws-*.log; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            grep -E 'tool_shape|429|listening' "$f" | tail -10 || true
          done

      - name: Stop sing-box
        if: always()
        run: |
          set -uo pipefail
          [ -f "$WORK/vpngate/singbox.pid" ] && kill "$(cat "$WORK/vpngate/singbox.pid")" 2>/dev/null || true
          pkill -f "sing-box run -c sb" || true
          echo done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stub-ab-${{ github.run_id }}
          path: |
            stub_ab.json
            stub_ab.log
          retention-days: 7
          if-no-files-found: warn
